<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Транслит — перевод латиницы в кириллицу</title>
<meta name="description" content="Онлайн-транслитерация текста с латиницы на кириллицу и обратно в реальном времени. Схема как на translit.net.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%232f9e5f' width='100' height='100' rx='20'/><text x='50' y='66' font-size='58' font-weight='bold' text-anchor='middle' fill='white' font-family='Arial'>Я</text></svg>">
<style>
  :root {
    --bg: #f2f4f3;
    --panel: #ffffff;
    --text: #1b1f1d;
    --muted: #6b7772;
    --border: #d8dedb;
    --accent: #2f9e5f;
    --accent-hover: #26804e;
    --accent-soft: #e6f5ec;
    --shadow: 0 6px 24px rgba(0, 0, 0, .07);
    --radius: 12px;
  }

  body.dark {
    --bg: #131619;
    --panel: #1d2226;
    --text: #e8ecea;
    --muted: #93a09a;
    --border: #313840;
    --accent: #3fb573;
    --accent-hover: #52cd86;
    --accent-soft: #1a2b23;
    --shadow: 0 6px 24px rgba(0, 0, 0, .35);
  }

  * { box-sizing: border-box; }

  html, body { min-height: 100%; }

  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    transition: background .2s ease, color .2s ease;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: .2px;
  }

  .brand .badge {
    display: grid;
    place-items: center;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 16px;
  }

  .icon-btn {
    width: 38px;
    height: 38px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: transparent;
    color: var(--text);
    font-size: 17px;
    line-height: 1;
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease;
  }

  .icon-btn:hover {
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  main {
    width: min(1120px, 100%);
    margin: 0 auto;
    padding: 20px;
    flex: 1 0 auto;
  }

  .panes {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: stretch;
    gap: 10px;
  }

  .pane {
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: background .2s ease, border-color .2s ease;
  }

  .pane-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .6px;
  }

  .pane-head .count {
    font-weight: 500;
    letter-spacing: 0;
    text-transform: none;
    font-variant-numeric: tabular-nums;
  }

  .pane textarea {
    flex: 1;
    width: 100%;
    min-height: 280px;
    padding: 16px;
    border: 0;
    outline: none;
    resize: vertical;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 17px;
    line-height: 1.55;
  }

  .pane textarea::placeholder { color: var(--muted); opacity: .75; }

  .pane.out textarea { color: var(--accent); }

  .swap {
    display: grid;
    place-items: center;
  }

  .swap button {
    width: 44px;
    height: 44px;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: var(--panel);
    color: var(--text);
    font-size: 19px;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: background .15s ease, border-color .15s ease, transform .15s ease;
  }

  .swap button:hover {
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .swap button:active { transform: scale(.94); }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 14px;
  }

  button.btn {
    border: 1px solid transparent;
    border-radius: 10px;
    padding: 11px 20px;
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease, color .15s ease;
  }

  button.btn.primary {
    background: var(--accent);
    color: #fff;
  }

  button.btn.primary:hover { background: var(--accent-hover); }

  button.btn.primary.done {
    background: var(--accent-hover);
  }

  button.btn.secondary {
    background: transparent;
    border-color: var(--border);
    color: var(--text);
  }

  button.btn.secondary:hover {
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .ref {
    margin-top: 22px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 6px 16px 16px;
    transition: background .2s ease, border-color .2s ease;
  }

  .ref summary {
    cursor: pointer;
    padding: 12px 0;
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    list-style: none;
  }

  .ref summary::-webkit-details-marker { display: none; }

  .ref summary::after {
    content: "▾";
    float: right;
    color: var(--muted);
    transition: transform .2s ease;
  }

  .ref:not([open]) summary::after { transform: rotate(-90deg); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
    gap: 6px;
    margin-top: 4px;
  }

  .cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-height: 62px;
    padding: 6px 4px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    transition: background .12s ease, border-color .12s ease;
  }

  .cell:hover {
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .cell .cyr {
    font-size: 20px;
    font-weight: 700;
    line-height: 1;
  }

  .cell .lat {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    word-break: break-word;
    line-height: 1.25;
  }

  .foot {
    padding: 16px 20px 26px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
  }

  @media (max-width: 760px) {
    main { padding: 14px; }
    .panes {
      grid-template-columns: 1fr;
      gap: 8px;
    }
    .pane textarea { min-height: 170px; }
    .swap button { transform: rotate(90deg); width: 40px; height: 40px; }
    .swap button:active { transform: rotate(90deg) scale(.94); }
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="badge">Я</span> Транслит</div>
    <button class="icon-btn" id="themeBtn" type="button" title="Сменить тему" aria-label="Сменить тему">🌙</button>
  </div>

  <main>
    <div class="panes">
      <section class="pane">
        <div class="pane-head">
          <span id="srcLabel">Латиница</span>
          <span class="count" id="srcCount">0</span>
        </div>
        <textarea id="src" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="Печатайте латиницей…"></textarea>
      </section>

      <div class="swap">
        <button id="swapBtn" type="button" title="Поменять направление" aria-label="Поменять направление">⇄</button>
      </div>

      <section class="pane out">
        <div class="pane-head">
          <span id="dstLabel">Кириллица</span>
          <span class="count" id="dstCount">0</span>
        </div>
        <textarea id="dst" spellcheck="false" readonly placeholder="Здесь появится результат"></textarea>
      </section>
    </div>

    <div class="controls">
      <button class="btn primary" id="copyBtn" type="button">Копировать</button>
      <button class="btn secondary" id="clearBtn" type="button">Очистить</button>
    </div>

    <details class="ref" open>
      <summary>Таблица транслитерации</summary>
      <div class="grid" id="grid"></div>
    </details>
  </main>

  <div class="foot">Нажмите на любую клетку таблицы, чтобы вставить символ</div>

  <script>
    const LAT2CYR = {
      a: 'а', b: 'б', v: 'в', g: 'г', d: 'д', e: 'е', z: 'з', i: 'и', j: 'й',
      k: 'к', l: 'л', m: 'м', n: 'н', o: 'о', p: 'п', r: 'р', s: 'с', t: 'т',
      u: 'у', f: 'ф', h: 'х', x: 'х', c: 'ц', y: 'ы', w: 'щ',
      zh: 'ж', ch: 'ч', sh: 'ш', shh: 'щ',
      jo: 'ё', yo: 'ё', 'ö': 'ё',
      je: 'э', 'ä': 'э',
      ju: 'ю', yu: 'ю', 'ü': 'ю',
      ja: 'я', ya: 'я', q: 'я',
      "'": 'ь', mz: 'ь',
      '#': 'ъ', '##': 'ъ', tvz: 'ъ'
    };

    const CYR2LAT = {
      'а': 'a', 'б': 'b', 'в': 'v', 'г': 'g', 'д': 'd', 'е': 'e', 'ё': 'jo',
      'ж': 'zh', 'з': 'z', 'и': 'i', 'й': 'j', 'к': 'k', 'л': 'l', 'м': 'm',
      'н': 'n', 'о': 'o', 'п': 'p', 'р': 'r', 'с': 's', 'т': 't', 'у': 'u',
      'ф': 'f', 'х': 'h', 'ц': 'c', 'ч': 'ch', 'ш': 'sh', 'щ': 'shh',
      'ъ': '##', 'ы': 'y', 'ь': "'", 'э': 'je', 'ю': 'ju', 'я': 'ja'
    };

    const TABLE = [
      { cyr: 'А', lat: 'a' },
      { cyr: 'Б', lat: 'b' },
      { cyr: 'В', lat: 'v' },
      { cyr: 'Г', lat: 'g' },
      { cyr: 'Д', lat: 'd' },
      { cyr: 'Е', lat: 'e' },
      { cyr: 'Ё', lat: 'jo, yo, ö', primary: 'jo' },
      { cyr: 'Ж', lat: 'zh' },
      { cyr: 'З', lat: 'z' },
      { cyr: 'И', lat: 'i' },
      { cyr: 'Й', lat: 'j' },
      { cyr: 'К', lat: 'k' },
      { cyr: 'Л', lat: 'l' },
      { cyr: 'М', lat: 'm' },
      { cyr: 'Н', lat: 'n' },
      { cyr: 'О', lat: 'o' },
      { cyr: 'П', lat: 'p' },
      { cyr: 'Р', lat: 'r' },
      { cyr: 'С', lat: 's' },
      { cyr: 'Т', lat: 't' },
      { cyr: 'У', lat: 'u' },
      { cyr: 'Ф', lat: 'f' },
      { cyr: 'Х', lat: 'h, x' },
      { cyr: 'Ц', lat: 'c' },
      { cyr: 'Ч', lat: 'ch' },
      { cyr: 'Ш', lat: 'sh' },
      { cyr: 'Щ', lat: 'shh, w' },
      { cyr: 'Ъ', lat: '##, #, tvz', primary: '##' },
      { cyr: 'Ы', lat: 'y' },
      { cyr: 'Ь', lat: "' , mz" },
      { cyr: 'Э', lat: 'je, ä' },
      { cyr: 'Ю', lat: 'ju, yu, ü' },
      { cyr: 'Я', lat: 'ja, ya, q' }
    ];

    const LAT_KEYS = Object.keys(LAT2CYR).sort((a, b) => b.length - a.length);

    const srcEl = document.getElementById('src');
    const dstEl = document.getElementById('dst');
    const srcLabel = document.getElementById('srcLabel');
    const dstLabel = document.getElementById('dstLabel');
    const srcCount = document.getElementById('srcCount');
    const dstCount = document.getElementById('dstCount');
    const copyBtn = document.getElementById('copyBtn');
    const clearBtn = document.getElementById('clearBtn');
    const swapBtn = document.getElementById('swapBtn');
    const themeBtn = document.getElementById('themeBtn');
    const gridEl = document.getElementById('grid');

    let direction = 'lat2cyr';

    function isAllCaps(sample) {
      return sample === sample.toUpperCase() && sample !== sample.toLowerCase();
    }

    function applyCase(result, sample) {
      const first = sample.charAt(0);
      const firstUpper = first === first.toUpperCase() && first !== first.toLowerCase();
      if (sample.length > 1 && isAllCaps(sample)) return result.toUpperCase();
      if (firstUpper) return result.charAt(0).toUpperCase() + result.slice(1);
      return result;
    }

    function toCyrillic(text) {
      let out = '';
      let i = 0;
      while (i < text.length) {
        let hit = null;
        for (const key of LAT_KEYS) {
          if (i + key.length <= text.length &&
              text.substr(i, key.length).toLowerCase() === key) {
            hit = key;
            break;
          }
        }
        if (hit) {
          out += applyCase(LAT2CYR[hit], text.substr(i, hit.length));
          i += hit.length;
        } else {
          out += text.charAt(i);
          i += 1;
        }
      }
      return out;
    }

    function toLatin(text) {
      let out = '';
      for (const ch of text) {
        const mapped = CYR2LAT[ch.toLowerCase()];
        out += mapped ? applyCase(mapped, ch) : ch;
      }
      return out;
    }

    function convert() {
      const text = srcEl.value;
      dstEl.value = direction === 'lat2cyr' ? toCyrillic(text) : toLatin(text);
      updateCounts();
    }

    function updateCounts() {
      srcCount.textContent = Array.from(srcEl.value).length;
      dstCount.textContent = Array.from(dstEl.value).length;
    }

    function updateLabels() {
      const lat = direction === 'lat2cyr';
      srcLabel.textContent = lat ? 'Латиница' : 'Кириллица';
      dstLabel.textContent = lat ? 'Кириллица' : 'Латиница';
      srcEl.placeholder = lat ? 'Печатайте латиницей…' : 'Печатайте кириллицей…';
      dstEl.placeholder = lat ? 'Здесь появится кириллица' : 'Здесь появится латиница';
    }

    function swap() {
      const previous = dstEl.value;
      direction = direction === 'lat2cyr' ? 'cyr2lat' : 'lat2cyr';
      srcEl.value = previous;
      updateLabels();
      convert();
      srcEl.focus();
    }

    function clearAll() {
      srcEl.value = '';
      convert();
      srcEl.focus();
    }

    function copyResult() {
      const text = dstEl.value;
      const done = () => {
        copyBtn.textContent = 'Скопировано ✓';
        copyBtn.classList.add('done');
        setTimeout(() => {
          copyBtn.textContent = 'Копировать';
          copyBtn.classList.remove('done');
        }, 1500);
      };

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(done, fallback);
      } else {
        fallback();
      }

      function fallback() {
        dstEl.removeAttribute('readonly');
        dstEl.select();
        try { document.execCommand('copy'); } catch (e) {}
        dstEl.setAttribute('readonly', '');
        window.getSelection().removeAllRanges();
        srcEl.focus();
        done();
      }
    }

    function insertAtCursor(text) {
      const start = srcEl.selectionStart ?? srcEl.value.length;
      const end = srcEl.selectionEnd ?? srcEl.value.length;
      srcEl.value = srcEl.value.slice(0, start) + text + srcEl.value.slice(end);
      const pos = start + text.length;
      srcEl.setSelectionRange(pos, pos);
      srcEl.focus();
      convert();
    }

    function buildTable() {
      const frag = document.createDocumentFragment();
      for (const entry of TABLE) {
        const primary = entry.primary || entry.lat.split(',')[0].trim();

        const cell = document.createElement('button');
        cell.type = 'button';
        cell.className = 'cell';
        cell.title = 'Вставить «' + entry.cyr + '»';

        const upper = document.createElement('span');
        upper.className = 'cyr';
        upper.textContent = entry.cyr;

        const lower = document.createElement('div');
        lower.className = 'lat';
        lower.textContent = entry.lat;

        cell.append(upper, lower);
        cell.addEventListener('click', () => {
          insertAtCursor(direction === 'lat2cyr' ? primary : entry.cyr.toLowerCase());
        });
        frag.appendChild(cell);
      }
      gridEl.appendChild(frag);
    }

    function applyTheme(theme) {
      document.body.classList.toggle('dark', theme === 'dark');
      themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
      localStorage.setItem('theme', theme);
    }

    function initTheme() {
      const saved = localStorage.getItem('theme');
      if (saved === 'dark' || saved === 'light') {
        applyTheme(saved);
      } else {
        applyTheme(window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      }
    }

    srcEl.addEventListener('input', convert);
    swapBtn.addEventListener('click', swap);
    clearBtn.addEventListener('click', clearAll);
    copyBtn.addEventListener('click', copyResult);
    themeBtn.addEventListener('click', () => {
      applyTheme(document.body.classList.contains('dark') ? 'light' : 'dark');
    });

    buildTable();
    initTheme();
    updateLabels();
    updateCounts();
  </script>
</body>
</html>
