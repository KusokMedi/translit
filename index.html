<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Транслит — печатайте латиницей, получайте кириллицу</title>
<meta name="description" content="Онлайн-транслитератор: печатайте латиницей — текст сразу становится кириллицей. Esc переключает режим ввода. Схема как на translit.net.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d2226" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="Транслит">
<meta name="format-detection" content="telephone=no">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%232f9e5f' width='100' height='100' rx='20'/><text x='50' y='66' font-size='58' font-weight='bold' text-anchor='middle' fill='white' font-family='Arial'>Я</text></svg>">
<style>
  :root {
    --bg: #f2f4f3;
    --panel: #ffffff;
    --text: #1b1f1d;
    --muted: #6b7772;
    --border: #d8dedb;
    --accent: #2f9e5f;
    --accent-hover: #26804e;
    --accent-soft: #e6f5ec;
    --shadow: 0 6px 24px rgba(0, 0, 0, .07);
    --radius: 12px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131619;
      --panel: #1d2226;
      --text: #e8ecea;
      --muted: #93a09a;
      --border: #313840;
      --accent: #3fb573;
      --accent-hover: #52cd86;
      --accent-soft: #1a2b23;
      --shadow: 0 6px 24px rgba(0, 0, 0, .35);
    }
  }

  body.latin-mode {
    --accent: #d9930f;
    --accent-hover: #b87b0b;
    --accent-soft: #fdf3dd;
  }

  @media (prefers-color-scheme: dark) {
    body.latin-mode {
      --accent: #e0a534;
      --accent-hover: #f0b64a;
      --accent-soft: #33280f;
    }
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  html, body { min-height: 100%; }

  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    transition: background .2s ease, color .2s ease;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: .2px;
  }

  .brand .badge {
    display: grid;
    place-items: center;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 16px;
    transition: background .2s ease;
  }

  main {
    display: flex;
    flex-direction: column;
    width: min(1120px, 100%);
    margin: 0 auto;
    padding: 18px 20px 22px;
    flex: 1 0 auto;
    gap: 12px;
  }

  .mode {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    font-size: 13px;
    color: var(--muted);
  }

  .mode .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
    transition: background .2s ease, box-shadow .2s ease;
  }

  .linkbtn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
    padding: 5px 6px 5px 13px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    line-height: 1.2;
    cursor: pointer;
    transition: color .15s ease, border-color .15s ease, background .15s ease;
  }

  .linkbtn:hover {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  kbd {
    display: inline-block;
    padding: 2px 7px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--panel);
    color: var(--muted);
    font: inherit;
    font-size: 10.5px;
    font-weight: 700;
    line-height: 1.3;
    transition: color .15s ease, border-color .15s ease;
  }

  .linkbtn:hover kbd {
    color: var(--accent);
    border-color: var(--accent);
  }

  .editor {
    display: flex;
    flex-direction: column;
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: background .2s ease, border-color .2s ease;
  }

  .editor textarea {
    flex: 1;
    width: 100%;
    min-height: 52vh;
    padding: 18px;
    border: 0;
    outline: none;
    resize: vertical;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 18px;
    line-height: 1.6;
  }

  .editor textarea::placeholder { color: var(--muted); opacity: .75; }

  @media (pointer: coarse) {
    .editor textarea { resize: none; }
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
  }

  button.btn {
    border: 1px solid transparent;
    border-radius: 10px;
    padding: 11px 20px;
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease, color .15s ease;
  }

  button.btn.primary {
    background: var(--accent);
    color: #fff;
  }

  button.btn.primary:hover { background: var(--accent-hover); }

  button.btn.primary.done { background: var(--accent-hover); }

  button.btn.secondary {
    background: transparent;
    border-color: var(--border);
    color: var(--text);
  }

  button.btn.secondary:hover {
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .count {
    margin-left: auto;
    font-size: 13px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .tools {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  button.btn.ghost {
    padding: 8px 13px;
    font-size: 13px;
    font-weight: 600;
    background: transparent;
    border-color: var(--border);
    color: var(--muted);
  }

  button.btn.ghost:hover {
    color: var(--text);
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  button.btn.ghost:disabled {
    opacity: .4;
    cursor: default;
  }

  button.btn.ghost:disabled:hover {
    color: var(--muted);
    border-color: var(--border);
    background: transparent;
  }

  .ref {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 0 16px;
    transition: background .2s ease, border-color .2s ease;
  }

  .ref[open] { padding-bottom: 16px; }

  .ref summary {
    cursor: pointer;
    padding: 12px 0;
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    list-style: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .ref summary::-webkit-details-marker { display: none; }

  .ref summary::after {
    content: "▾";
    margin-left: auto;
    color: var(--muted);
    transition: transform .2s ease;
  }

  .ref:not([open]) summary::after { transform: rotate(-90deg); }

  .kbd-scroll {
    overflow-x: auto;
    overflow-y: hidden;
    padding-bottom: 2px;
    scrollbar-width: thin;
  }

  .kbd {
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin-top: 2px;
  }

  .krow {
    display: grid;
    grid-template-columns: repeat(60, 1fr);
  }

  .key {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    min-width: 0;
    height: 40px;
    margin: 2px;
    padding: 2px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--text);
    font: inherit;
    cursor: pointer;
    transition: background .12s ease, border-color .12s ease;
  }

  .key.letter:hover,
  .key.punc:hover,
  .key.act:hover {
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .key:active { transform: translateY(1px); }

  .key .cap {
    position: absolute;
    top: 2px;
    left: 4px;
    font-size: 7.5px;
    line-height: 1;
    color: var(--muted);
    opacity: .5;
  }

  .key .bot {
    font-size: 15px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1.1;
  }

  .key .mid {
    font-size: 8px;
    color: var(--muted);
    line-height: 1.05;
    text-align: center;
    word-break: break-word;
  }

  .key.punc .bot {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
  }

  .key .lbl {
    font-size: 9.5px;
    line-height: 1.1;
    color: var(--muted);
    text-align: center;
  }

  .key.dead {
    cursor: default;
    border-color: var(--border);
    background: transparent;
  }

  .key.dead:active { transform: none; }

  .key.act.on {
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .key.act.on .lbl { color: var(--accent); }

  button, summary, .key {
    -webkit-tap-highlight-color: transparent;
  }

  .kbd-scroll.scrollable {
    -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 30px), transparent);
    mask-image: linear-gradient(to right, #000 calc(100% - 30px), transparent);
  }

  @media (max-width: 760px) {
    .topbar { padding: 8px 14px; }
    .brand { font-size: 15px; gap: 8px; }
    .brand .badge { width: 26px; height: 26px; border-radius: 7px; font-size: 14px; }

    main {
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
      gap: 10px;
    }

    .mode { font-size: 12.5px; gap: 8px; }
    .mode .dot { width: 6px; height: 6px; }

    .linkbtn {
      padding: 9px 14px;
      font-size: 12.5px;
      touch-action: manipulation;
    }

    .linkbtn kbd { display: none; }

    .editor textarea {
      min-height: 40vh;
      padding: 14px;
      font-size: 17px;
      line-height: 1.55;
      resize: none;
    }

    .controls { gap: 8px; }
    button.btn { padding: 12px 14px; touch-action: manipulation; }
    .controls button.btn { flex: 1 1 0; }
    .count { margin-left: 0; font-size: 12px; }

    .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    button.btn.ghost { padding: 11px 6px; font-size: 12.5px; }

    .ref summary { padding: 12px 0; font-size: 13.5px; }

    .kbd { min-width: 520px; }
    .key { height: 34px; margin: 1.5px; }
    .key .bot { font-size: 13px; }
    .key .mid { display: none; }
    .key .cap { top: 1px; left: 3px; font-size: 7px; }
    .key .lbl { font-size: 8.5px; }
  }

  @media (max-width: 360px) {
    .kbd { min-width: 460px; }
    button.btn.ghost { font-size: 12px; }
    .mode { font-size: 12px; }
  }

  @media (max-width: 380px) {
    .linkbtn {
      width: 100%;
      justify-content: center;
    }
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="badge">Я</span> Транслит</div>
  </div>

  <main>
    <div class="mode">
      <span class="dot"></span>
      <span id="modeText">Я хочу писать по-русски</span>
      <button class="linkbtn" id="modeBtn" type="button"><span id="modeBtnLabel">Включить латиницу</span><kbd>Esc</kbd></button>
    </div>

    <div class="editor">
      <textarea id="src" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="Начните печатать латиницей…"></textarea>
    </div>

    <div class="controls">
      <button class="btn primary" id="copyBtn" type="button">Копировать</button>
      <button class="btn secondary" id="clearBtn" type="button">Очистить</button>
      <span class="count" id="count">0</span>
    </div>

    <div class="tools">
      <button class="btn ghost" id="toCyrBtn" type="button">В кириллицу</button>
      <button class="btn ghost" id="toLatBtn" type="button">В латиницу</button>
      <button class="btn ghost" id="googleBtn" type="button">Найти в Google</button>
      <button class="btn ghost" id="youtubeBtn" type="button">Найти в YouTube</button>
    </div>

    <details class="ref" id="ref">
      <summary>Экранная клавиатура</summary>
      <div class="kbd-scroll">
        <div class="kbd" id="kbd"></div>
      </div>
    </details>
  </main>

  <script>
    const LAT2CYR = {
      a: 'а', b: 'б', v: 'в', g: 'г', d: 'д', e: 'е', z: 'з', i: 'и', j: 'й',
      k: 'к', l: 'л', m: 'м', n: 'н', o: 'о', p: 'п', r: 'р', s: 'с', t: 'т',
      u: 'у', f: 'ф', h: 'х', x: 'х', c: 'ц', y: 'ы', w: 'щ',
      zh: 'ж', ch: 'ч', sh: 'ш', shh: 'щ',
      jo: 'ё', yo: 'ё', 'ö': 'ё', '`': 'ё',
      je: 'э', 'ä': 'э',
      ju: 'ю', yu: 'ю', 'ü': 'ю',
      ja: 'я', ya: 'я', q: 'я',
      "'": 'ь', mz: 'ь', mjz: 'ь',
      '#': 'ъ', '##': 'ъ', tvz: 'ъ'
    };

    const CYR2LAT = {
      'а': 'a', 'б': 'b', 'в': 'v', 'г': 'g', 'д': 'd', 'е': 'e', 'ё': 'jo',
      'ж': 'zh', 'з': 'z', 'и': 'i', 'й': 'j', 'к': 'k', 'л': 'l', 'м': 'm',
      'н': 'n', 'о': 'o', 'п': 'p', 'р': 'r', 'с': 's', 'т': 't', 'у': 'u',
      'ф': 'f', 'х': 'h', 'ц': 'c', 'ч': 'ch', 'ш': 'sh', 'щ': 'shh', 'ъ': '#',
      'ы': 'y', 'ь': "'", 'э': 'je', 'ю': 'ju', 'я': 'ja'
    };

    const F_ROW = [{ lbl: 'esc', act: 'esc' }];
    for (let i = 1; i <= 12; i++) F_ROW.push({ blank: true, name: 'F' + i });
    F_ROW.push(
      { blank: true, name: 'insert' },
      { lbl: 'home', act: 'home' },
      { lbl: 'end', act: 'end' },
      { lbl: 'delete', act: 'delete' }
    );

    const KEY_ROWS = [
      F_ROW,
      [
        { cyr: 'Ё', cap: '`', lat: 'jo,yo,ö,`' },
        { ch: '1' },
        { ch: '2' },
        { ch: '3' },
        { ch: '4' },
        { ch: '5' },
        { ch: '6' },
        { ch: '7' },
        { ch: '8' },
        { ch: '9' },
        { ch: '0' },
        { ch: '-', up: '_' },
        { ch: '=', up: '+' },
        { w: 2, lbl: '⌫', act: 'backspace' }
      ],
      [
        { w: 1.5, blank: true, name: 'tab' },
        { cyr: 'Й', cap: 'q', lat: 'j' },
        { cyr: 'Ц', cap: 'w', lat: 'c' },
        { cyr: 'У', cap: 'e', lat: 'u' },
        { cyr: 'К', cap: 'r', lat: 'k' },
        { cyr: 'Е', cap: 't', lat: 'e' },
        { cyr: 'Н', cap: 'y', lat: 'n' },
        { cyr: 'Г', cap: 'u', lat: 'g' },
        { cyr: 'Ш', cap: 'i', lat: 'sh' },
        { cyr: 'Щ', cap: 'o', lat: 'shh,w' },
        { cyr: 'З', cap: 'p', lat: 'z' },
        { cyr: 'Х', cap: '[', lat: 'h,x' },
        { cyr: 'Ъ', cap: ']', lat: '#,tvz' },
        { w: 1.5, ch: '\\', up: '|' }
      ],
      [
        { w: 1.75, lbl: 'caps', act: 'caps' },
        { cyr: 'Ф', cap: 'a', lat: 'f' },
        { cyr: 'Ы', cap: 's', lat: 'y' },
        { cyr: 'В', cap: 'd', lat: 'v' },
        { cyr: 'А', cap: 'f', lat: 'a' },
        { cyr: 'П', cap: 'g', lat: 'p' },
        { cyr: 'Р', cap: 'h', lat: 'r' },
        { cyr: 'О', cap: 'j', lat: 'o' },
        { cyr: 'Л', cap: 'k', lat: 'l' },
        { cyr: 'Д', cap: 'l', lat: 'd' },
        { cyr: 'Ж', cap: ';', lat: 'zh' },
        { cyr: 'Э', cap: "'", lat: 'je,ä' },
        { w: 2.25, lbl: 'enter', act: 'enter' }
      ],
      [
        { w: 1.5, lbl: 'shift', act: 'shift', side: 'l' },
        { cyr: 'Я', cap: 'z', lat: 'ja,ya,q' },
        { cyr: 'Ч', cap: 'x', lat: 'ch' },
        { cyr: 'С', cap: 'c', lat: 's' },
        { cyr: 'М', cap: 'v', lat: 'm' },
        { cyr: 'И', cap: 'b', lat: 'i' },
        { cyr: 'Т', cap: 'n', lat: 't' },
        { cyr: 'Ь', cap: 'm', lat: "',mjz" },
        { cyr: 'Б', cap: ',', lat: 'b' },
        { cyr: 'Ю', cap: '.', lat: 'ju,yu,ü' },
        { ch: ',', up: '<' },
        { ch: '.', up: '>' },
        { ch: '/', up: '?' },
        { w: 1.5, lbl: 'shift', act: 'shift', side: 'r' }
      ],
      [
        { w: 1.25, blank: true },
        { w: 1.25, blank: true },
        { w: 1.25, blank: true },
        { w: 7.5, lbl: 'пробел', act: 'space' },
        { w: 1.25, blank: true },
        { w: 1.25, blank: true },
        { w: 1.25, blank: true }
      ]
    ];

    const LAT_KEYS = Object.keys(LAT2CYR).sort((a, b) => b.length - a.length);
    const PREFIXES = new Set();
    for (const k of LAT_KEYS) {
      for (let i = 1; i < k.length; i++) PREFIXES.add(k.slice(0, i));
    }

    const srcEl = document.getElementById('src');
    const countEl = document.getElementById('count');
    const copyBtn = document.getElementById('copyBtn');
    const clearBtn = document.getElementById('clearBtn');
    const modeBtn = document.getElementById('modeBtn');
    const modeBtnLabel = document.getElementById('modeBtnLabel');
    const modeText = document.getElementById('modeText');
    const toCyrBtn = document.getElementById('toCyrBtn');
    const toLatBtn = document.getElementById('toLatBtn');
    const googleBtn = document.getElementById('googleBtn');
    const youtubeBtn = document.getElementById('youtubeBtn');
    const toolBtns = [toCyrBtn, toLatBtn, googleBtn, youtubeBtn];
    const kbdEl = document.getElementById('kbd');
    const modKeys = { caps: null, l: null, r: null };
    const puncKeys = [];

    let translitOn = true;
    let capsOn = false;
    let shiftL = false;
    let shiftR = false;
    let tailSource = '';
    let tailRendered = '';
    let tailStart = 0;

    function isAllCaps(sample) {
      return sample === sample.toUpperCase() && sample !== sample.toLowerCase();
    }

    function applyCase(result, sample) {
      const first = sample.charAt(0);
      const firstUpper = first === first.toUpperCase() && first !== first.toLowerCase();
      if (sample.length > 1 && isAllCaps(sample)) return result.toUpperCase();
      if (firstUpper) return result.charAt(0).toUpperCase() + result.slice(1);
      return result;
    }

    function toCyrillic(text) {
      let out = '';
      let i = 0;
      while (i < text.length) {
        let hit = null;
        for (const key of LAT_KEYS) {
          if (i + key.length <= text.length &&
              text.substr(i, key.length).toLowerCase() === key) {
            hit = key;
            break;
          }
        }
        if (hit) {
          out += applyCase(LAT2CYR[hit], text.substr(i, hit.length));
          i += hit.length;
        } else {
          out += text.charAt(i);
          i += 1;
        }
      }
      return out;
    }

    function toLatin(text) {
      let out = '';
      let inWord = false;
      for (const ch of text) {
        const low = ch.toLowerCase();
        const lat = CYR2LAT[low];
        if (!lat) {
          out += ch;
          inWord = /\p{L}/u.test(ch);
          continue;
        }
        if (ch === low) out += lat;
        else out += inWord ? lat.toUpperCase() : lat.charAt(0).toUpperCase() + lat.slice(1);
        inWord = true;
      }
      return out;
    }

    function resolveLive(buffer) {
      let committed = '';
      let i = 0;
      while (i < buffer.length) {
        const rest = buffer.slice(i);
        if (PREFIXES.has(rest.toLowerCase())) {
          return { committed: committed, pending: rest };
        }
        let hit = null;
        for (const key of LAT_KEYS) {
          if (i + key.length <= buffer.length &&
              buffer.substr(i, key.length).toLowerCase() === key) {
            hit = key;
            break;
          }
        }
        if (hit) {
          committed += applyCase(LAT2CYR[hit], buffer.substr(i, hit.length));
          i += hit.length;
        } else {
          committed += buffer.charAt(i);
          i += 1;
        }
      }
      return { committed: committed, pending: '' };
    }

    function updateCount() {
      countEl.textContent = Array.from(srcEl.value).length;
      const empty = !srcEl.value.trim();
      for (const btn of toolBtns) btn.disabled = empty;
    }

    function replaceSelection(text) {
      const start = srcEl.selectionStart;
      const end = srcEl.selectionEnd;
      srcEl.value = srcEl.value.slice(0, start) + text + srcEl.value.slice(end);
      const caret = start + text.length;
      srcEl.setSelectionRange(caret, caret);
      updateCount();
    }

    function resetTail() {
      tailSource = '';
      tailRendered = '';
    }

    function focusField() {
      if (window.matchMedia('(pointer: fine)').matches) srcEl.focus({ preventScroll: true });
    }

    function handleInput(e) {
      if (!translitOn) {
        resetTail();
        updateCount();
        return;
      }

      if (e.inputType === 'insertText' && e.data && e.data.length === 1) {
        let pos = srcEl.selectionStart;
        let at = pos - 1;

        if (at > 0 && srcEl.value.charAt(at - 1) === '+' && /^[A-Za-z]$/.test(e.data)) {
          srcEl.value = srcEl.value.slice(0, at - 1) + srcEl.value.slice(at);
          pos -= 1;
          at -= 1;
          srcEl.setSelectionRange(pos, pos);
        }

        const tailOk = tailSource &&
          tailStart + tailRendered.length === at &&
          srcEl.value.slice(tailStart, at) === tailRendered;

        if (!tailOk) {
          resetTail();
          tailStart = at;
        }

        const resolved = resolveLive(tailSource + e.data);
        const partial = toCyrillic(resolved.pending);
        const rendered = resolved.committed + partial;

        srcEl.value = srcEl.value.slice(0, tailStart) + rendered + srcEl.value.slice(pos);
        const caret = tailStart + rendered.length;
        srcEl.setSelectionRange(caret, caret);

        tailStart = tailStart + resolved.committed.length;
        tailRendered = partial;
        tailSource = resolved.pending;

        updateCount();
        return;
      }

      resetTail();
      updateCount();
    }

    function setMode(on) {
      resetTail();
      translitOn = on;
      if (on) {
        const before = srcEl.value;
        const after = toCyrillic(before);
        if (after !== before) {
          srcEl.value = after;
          srcEl.setSelectionRange(after.length, after.length);
        }
      }
      document.body.classList.toggle('latin-mode', !on);
      modeText.textContent = on ? 'Я хочу писать по-русски' : 'Я хочу писать латиницей';
      modeBtnLabel.textContent = on ? 'Включить латиницу' : 'Включить кириллицу';
      srcEl.placeholder = on ? 'Начните печатать латиницей…' : 'Обычный ввод — без транслита…';
      updateCount();
      srcEl.focus({ preventScroll: true });
    }

    function clearAll() {
      srcEl.value = '';
      resetTail();
      updateCount();
      srcEl.focus({ preventScroll: true });
    }

    function replaceAll(text) {
      resetTail();
      srcEl.value = text;
      srcEl.setSelectionRange(text.length, text.length);
      updateCount();
      srcEl.focus({ preventScroll: true });
    }

    function searchQuery() {
      const start = srcEl.selectionStart;
      const end = srcEl.selectionEnd;
      return (start !== end ? srcEl.value.slice(start, end) : srcEl.value).trim();
    }

    function openSearch(base) {
      const query = searchQuery();
      if (!query) return;
      window.open(base + encodeURIComponent(query), '_blank', 'noopener');
    }

    function copyAll() {
      const text = srcEl.value;
      const done = () => {
        copyBtn.textContent = 'Скопировано ✓';
        copyBtn.classList.add('done');
        setTimeout(() => {
          copyBtn.textContent = 'Копировать';
          copyBtn.classList.remove('done');
        }, 1500);
      };

      const fallback = () => {
        srcEl.select();
        try { document.execCommand('copy'); } catch (err) {}
        const caret = srcEl.value.length;
        srcEl.setSelectionRange(caret, caret);
        srcEl.focus({ preventScroll: true });
        done();
      };

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(done, fallback);
      } else {
        fallback();
      }
    }

    function insertChar(text) {
      resetTail();
      replaceSelection(text);
      focusField();
    }

    function span(cls, text) {
      const el = document.createElement('span');
      el.className = cls;
      el.textContent = text;
      return el;
    }

    function isUpper() {
      return capsOn || shiftL || shiftR;
    }

    function syncMods() {
      if (modKeys.caps) modKeys.caps.classList.toggle('on', capsOn);
      if (modKeys.l) modKeys.l.classList.toggle('on', shiftL);
      if (modKeys.r) modKeys.r.classList.toggle('on', shiftR);
      const shifted = isUpper();
      kbdEl.classList.toggle('shifted', shifted);
      for (const p of puncKeys) p.bot.textContent = shifted ? p.up : p.ch;
    }

    function consumeShift() {
      if (!shiftL && !shiftR) return;
      shiftL = false;
      shiftR = false;
      syncMods();
    }

    function insertKey(entry) {
      const upper = isUpper();
      consumeShift();
      if (translitOn) {
        insertChar(upper ? entry.cyr : entry.cyr.toLowerCase());
        return;
      }
      const primary = entry.lat.split(',')[0].trim();
      insertChar(upper ? primary.toUpperCase() : primary);
    }

    function insertPunc(entry) {
      const upper = isUpper();
      consumeShift();
      insertChar(upper && entry.up ? entry.up : entry.ch);
    }

    function backspace() {
      const start = srcEl.selectionStart;
      const end = srcEl.selectionEnd;
      resetTail();
      if (start !== end) {
        replaceSelection('');
      } else if (start > 0) {
        srcEl.value = srcEl.value.slice(0, start - 1) + srcEl.value.slice(start);
        srcEl.setSelectionRange(start - 1, start - 1);
        updateCount();
      }
      focusField();
    }

    function deleteForward() {
      const start = srcEl.selectionStart;
      const end = srcEl.selectionEnd;
      resetTail();
      if (start !== end) {
        replaceSelection('');
      } else if (start < srcEl.value.length) {
        srcEl.value = srcEl.value.slice(0, start) + srcEl.value.slice(start + 1);
        srcEl.setSelectionRange(start, start);
        updateCount();
      }
      focusField();
    }

    function moveCaret(pos) {
      focusField();
      srcEl.setSelectionRange(pos, pos);
    }

    function runAction(act, side) {
      switch (act) {
        case 'esc': setMode(!translitOn); break;
        case 'caps': capsOn = !capsOn; syncMods(); focusField(); break;
        case 'shift':
          if (side === 'l') shiftL = !shiftL; else shiftR = !shiftR;
          syncMods();
          focusField();
          break;
        case 'space': insertChar(' '); break;
        case 'enter': insertChar('\n'); break;
        case 'backspace': backspace(); break;
        case 'delete': deleteForward(); break;
        case 'home': moveCaret(0); break;
        case 'end': moveCaret(srcEl.value.length); break;
      }
    }

    function makeKey(entry) {
      let el;

      if (entry.cyr) {
        el = document.createElement('button');
        el.type = 'button';
        el.className = 'key letter';
        el.title = entry.cyr + ' — набрать: ' + entry.lat;
        el.append(span('cap', entry.cap), span('bot', entry.cyr), span('mid', entry.lat));
        el.addEventListener('click', () => insertKey(entry));
      } else if (entry.ch) {
        el = document.createElement('button');
        el.type = 'button';
        el.className = 'key punc';
        el.title = entry.up ? entry.ch + ' / ' + entry.up : entry.ch;
        const puncBot = span('bot', entry.ch);
        el.append(puncBot);
        puncKeys.push({ bot: puncBot, ch: entry.ch, up: entry.up || entry.ch });
        el.addEventListener('click', () => insertPunc(entry));
      } else if (entry.blank) {
        el = document.createElement('div');
        el.className = 'key dead blank';
        el.setAttribute('aria-hidden', 'true');
        if (entry.name) el.title = entry.name;
      } else if (entry.act && entry.act !== 'none') {
        el = document.createElement('button');
        el.type = 'button';
        el.className = 'key act';
        el.append(span('lbl', entry.lbl));
        el.addEventListener('click', () => runAction(entry.act, entry.side));
        if (entry.act === 'caps') modKeys.caps = el;
        if (entry.act === 'shift') modKeys[entry.side] = el;
      } else {
        el = document.createElement('div');
        el.className = 'key dead';
        el.setAttribute('aria-hidden', 'true');
        el.append(span('lbl', entry.lbl));
      }

      el.style.gridColumn = 'span ' + Math.round((entry.w || 1) * 4);
      return el;
    }

    function buildTable() {
      for (const row of KEY_ROWS) {
        const units = row.reduce((sum, e) => sum + (e.w || 1), 0);
        const rowEl = document.createElement('div');
        rowEl.className = 'krow';
        rowEl.style.gridTemplateColumns = 'repeat(' + Math.round(units * 4) + ', 1fr)';
        for (const entry of row) rowEl.appendChild(makeKey(entry));
        kbdEl.appendChild(rowEl);
      }
    }

    srcEl.addEventListener('input', handleInput);

    srcEl.addEventListener('paste', (e) => {
      if (!translitOn) return;
      const text = e.clipboardData && e.clipboardData.getData('text');
      if (!text) return;
      e.preventDefault();
      resetTail();
      replaceSelection(toCyrillic(text));
    });

    srcEl.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.altKey || e.metaKey) return;
      if (['Enter', 'Tab', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End', 'PageUp', 'PageDown'].includes(e.key)) {
        resetTail();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      e.preventDefault();
      setMode(!translitOn);
    });

    modeBtn.addEventListener('click', () => setMode(!translitOn));
    clearBtn.addEventListener('click', clearAll);
    copyBtn.addEventListener('click', copyAll);
    toCyrBtn.addEventListener('click', () => replaceAll(toCyrillic(srcEl.value)));
    toLatBtn.addEventListener('click', () => replaceAll(toLatin(srcEl.value)));
    googleBtn.addEventListener('click', () => openSearch('https://www.google.com/search?q='));
    youtubeBtn.addEventListener('click', () => openSearch('https://www.youtube.com/results?search_query='));

    buildTable();
    updateCount();

    const kbdScroll = document.querySelector('.kbd-scroll');
    const syncKbdHint = () => {
      kbdScroll.classList.toggle('scrollable', kbdScroll.scrollWidth - kbdScroll.clientWidth > 2);
    };
    syncKbdHint();
    window.addEventListener('resize', syncKbdHint);
    document.getElementById('ref').addEventListener('toggle', (e) => {
      syncKbdHint();
      if (e.target.open && window.matchMedia('(max-width: 760px)').matches) {
        requestAnimationFrame(() => e.target.scrollIntoView({ block: 'nearest' }));
      }
    });
  </script>
</body>
</html>
