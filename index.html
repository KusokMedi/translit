<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Транслитератор</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%234caf50' width='100' height='100' rx='20'/><text x='50' y='65' font-size='60' font-weight='bold' text-anchor='middle' fill='white' font-family='Arial'>Я</text></svg>" />
  <style>
    :root {
      --bg: #f5f5f5;
      --panel: #ffffff;
      --text: #1f1f1f;
      --muted: #666;
      --border: #d9d9d9;
      --accent: #4caf50;
      --accent-dark: #2e7d32;
      --accent-soft: #e8f5e9;
      --warning: #ffb300;
      --warning-dark: #d68a00;
      --warning-soft: #fff3d6;
      --kbd-bg: #fafafa;
      --kbd-text: #111;
      --kbd-border: #cfcfcf;
      --shadow: rgba(0, 0, 0, 0.08);
    }

    body.dark {
      --bg: #171717;
      --panel: #2a2a2a;
      --text: #e7e7e7;
      --muted: #b0b0b0;
      --border: #444;
      --accent: #4caf50;
      --accent-dark: #2e7d32;
      --accent-soft: #1f3a27;
      --warning: #ffb300;
      --warning-dark: #d68a00;
      --warning-soft: #3a2a12;
      --kbd-bg: #333;
      --kbd-text: #efefef;
      --kbd-border: #555;
      --shadow: rgba(0, 0, 0, 0.35);
    }

    body.translit-off {
      --accent: var(--warning);
      --accent-dark: var(--warning-dark);
      --accent-soft: var(--warning-soft);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.25s ease, color 0.25s ease;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      width: min(900px, 100%);
      background: var(--panel);
      border-radius: 10px;
      box-shadow: 0 2px 12px var(--shadow);
      padding: 28px;
      transition: background 0.25s ease, box-shadow 0.25s ease;
    }

    h1 {
      margin: 0 0 18px 0;
      font-size: 24px;
      color: var(--text);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      padding: 10px 12px;
      border-radius: 6px;
      background: var(--accent-soft);
      color: var(--text);
      border: 1px solid transparent;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      transition: background 0.25s ease;
    }

    .status-text {
      font-size: 14px;
      font-weight: 600;
    }

    textarea {
      width: 100%;
      min-height: 300px;
      resize: vertical;
      font-size: 16px;
      font-family: Arial, sans-serif;
      border: 2px solid var(--border);
      background: transparent;
      color: var(--text);
      border-radius: 6px;
      padding: 16px;
      transition: border-color 0.2s ease, background 0.2s ease, color 0.2s ease;
      margin-bottom: 16px;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    body.translit-off textarea:focus {
      border-color: var(--warning);
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    button {
      border: none;
      border-radius: 6px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
      background: var(--accent);
      color: #fff;
    }

    button:hover {
      background: var(--accent-dark);
    }

    button:active {
      transform: translateY(1px);
    }

    .secondary {
      background: #8a8a8a;
    }

    .secondary:hover {
      background: #707070;
    }

    body.dark .secondary {
      background: #666;
    }

    body.dark .secondary:hover {
      background: #555;
    }

    .hint {
      margin-top: 12px;
      padding: 10px 12px;
      background: var(--accent-soft);
      border-left: 4px solid var(--accent);
      color: var(--text);
      border-radius: 4px;
      font-size: 12px;
      transition: background 0.25s ease, border-color 0.25s ease, color 0.25s ease;
      margin-bottom: 18px;
    }

    .keyboard {
      margin-top: 18px;
      background: var(--kbd-bg);
      color: var(--kbd-text);
      border: 1px solid var(--kbd-border);
      border-radius: 8px;
      padding: 16px;
    }

    .keyboard-title {
      font-size: 14px;
      font-weight: 700;
      margin: 0 0 12px 0;
    }

    .keyboard-row {
      display: flex;
      flex-wrap: nowrap;
      gap: 6px;
      margin-bottom: 8px;
      justify-content: center;
    }

    .key {
      flex: 1 1 auto;
      min-width: 42px;
      max-width: 52px;
      border: 1px solid var(--kbd-border);
      border-radius: 4px;
      background: var(--panel);
      color: var(--kbd-text);
      padding: 8px 4px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .key:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .key.space {
      flex: 1 1 35%;
      max-width: 160px;
    }

    .key.backspace,
    .key.enter {
      flex: 1 1 20%;
      max-width: 120px;
    }

    body.translit-off .key:hover {
      border-color: var(--warning);
      background: var(--warning-soft);
    }

    body.translit-off .status,
    body.translit-off .hint {
      background: var(--warning-soft);
      border-color: var(--warning);
    }

    body.translit-off .indicator {
      background: var(--warning);
    }

    body.translit-off button:not(.secondary) {
      background: var(--warning);
    }

    body.translit-off button:not(.secondary):hover {
      background: var(--warning-dark);
    }

    body.translit-off .hint {
      border-left-color: var(--warning);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Транслит с латиницы на русский</h1>

    <div class="status" id="status">
      <div class="indicator"></div>
      <span class="status-text" id="statusText">Транслит включен</span>
    </div>

    <textarea id="textArea" placeholder="Печатайте латиницей..."></textarea>

    <div class="controls">
      <button id="toggleBtn" onclick="toggleTranslit()">Выключить (Esc)</button>
      <button class="secondary" onclick="clearText()">Очистить</button>
      <button class="secondary" onclick="toggleTheme()">🌙 Тема</button>
    </div>

    <div class="hint" id="hint">
      💡 Нажмите <strong>Esc</strong>, чтобы переключить транслит
    </div>

    <div class="keyboard">
      <div class="keyboard-title">⌨️ Клавиатура</div>
      <div class="keyboard-row" id="kbdRow1"></div>
      <div class="keyboard-row" id="kbdRow2"></div>
      <div class="keyboard-row" id="kbdRow3"></div>
      <div class="keyboard-row" id="kbdRow4"></div>
      <div class="keyboard-row" id="kbdRow5"></div>
    </div>
  </div>

  <script>
    const singleMap = {
      a: 'а', b: 'б', c: 'ц', d: 'д', e: 'е', f: 'ф', g: 'г', h: 'х', i: 'и', j: 'й',
      k: 'к', l: 'л', m: 'м', n: 'н', o: 'о', p: 'п', r: 'р', s: 'с', t: 'т', u: 'у',
      v: 'в', w: 'в', x: 'кс', y: 'ы', z: 'з',
      A: 'А', B: 'Б', C: 'Ц', D: 'Д', E: 'Е', F: 'Ф', G: 'Г', H: 'Х', I: 'И', J: 'Й',
      K: 'К', L: 'Л', M: 'М', N: 'Н', O: 'О', P: 'П', R: 'Р', S: 'С', T: 'Т', U: 'У',
      V: 'В', W: 'В', X: 'Кс', Y: 'Ы', Z: 'З',
      q: 'я', Q: 'Я'
    };

    const comboMap = {
      ja: 'я', ya: 'я',
      jo: 'ё', yo: 'ё',
      ju: 'ю', yu: 'ю',
      je: 'э', ye: 'е',
      zh: 'ж', ch: 'ч', sh: 'ш', shh: 'щ',
      mjz: 'ь', "'": 'ь', '#': 'ъ', tvz: 'ъ'
    };

    const comboMapCapital = {
      Ja: 'Я', Ya: 'Я',
      Jo: 'Ё', Yo: 'Ё',
      Ju: 'Ю', Yu: 'Ю',
      Je: 'Э', Ye: 'Е',
      Zh: 'Ж', Ch: 'Ч', Sh: 'Ш', Shh: 'Щ',
      Mjz: 'Ь', "'": 'Ь', '#': 'Ъ', Tvz: 'Ъ'
    };

    const allCombos = { ...comboMap, ...comboMapCapital };

    let translitEnabled = true;
    let latinBuffer = '';

    const textArea = document.getElementById('textArea');
    const toggleBtn = document.getElementById('toggleBtn');
    const statusText = document.getElementById('statusText');
    const hint = document.getElementById('hint');

    function applyThemeFromSystem() {
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const saved = localStorage.getItem('theme');
      if (saved) {
        document.body.classList.toggle('dark', saved === 'dark');
      } else if (prefersDark) {
        document.body.classList.add('dark');
      }
    }

    function setTranslitState(enabled) {
      translitEnabled = enabled;
      document.body.classList.toggle('translit-off', !enabled);
      if (enabled) {
        statusText.textContent = 'Транслит включен';
        toggleBtn.textContent = 'Выключить (Esc)';
        textArea.placeholder = 'Печатайте латиницей...';
        hint.innerHTML = '💡 Нажмите <strong>Esc</strong>, чтобы переключить транслит';
      } else {
        statusText.textContent = 'Транслит выключен';
        toggleBtn.textContent = 'Включить (Esc)';
        textArea.placeholder = 'Транслит выключен...';
        hint.innerHTML = '💡 Транслит отключен — нажмите <strong>Esc</strong>, чтобы снова включить';
      }
      textArea.focus();
    }

    function toggleTranslit() {
      setTranslitState(!translitEnabled);
    }

    function clearText() {
      textArea.value = '';
      latinBuffer = '';
    }

    function toggleTheme() {
      const isDark = document.body.classList.contains('dark');
      document.body.classList.toggle('dark', !isDark);
      localStorage.setItem('theme', !isDark ? 'dark' : 'light');
    }

    function findComboAtEnd(str) {
      const keys = Object.keys(allCombos).sort((a, b) => b.length - a.length);
      for (const key of keys) {
        if (str.endsWith(key)) {
          return key;
        }
      }
      return null;
    }

    textArea.addEventListener('input', function (e) {
      if (!translitEnabled) return;

      const input = e.inputType;
      const data = e.data;

      if (input === 'insertText' && data) {
        const char = data;

        if (char.length === 1) {
          const before = textArea.value;
          const start = textArea.selectionStart;

          latinBuffer += char;
          const comboKey = findComboAtEnd(latinBuffer);

          if (comboKey && allCombos[comboKey]) {
            const out = allCombos[comboKey];
            const prev = textArea.value.slice(0, start - 1);
            const next = textArea.value.slice(start);
            textArea.value = prev + out + next;
            textArea.setSelectionRange(start, start);
            latinBuffer = '';
            return;
          }

          const replacement = singleMap[char];
          if (replacement) {
            const off = before.slice(0, start - 1);
            const on = before.slice(start);
            textArea.value = off + replacement + on;
            textArea.selectionStart = textArea.selectionEnd = start;
            latinBuffer = '';
            return;
          }
        }
      }

      if (input === 'deleteContentBackward') {
        latinBuffer = '';
      }
    });

    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') {
        event.preventDefault();
        toggleTranslit();
        return;
      }

      if (!translitEnabled) return;
      if (event.ctrlKey || event.altKey || event.metaKey) return;

      const key = event.key;

      if (key === 'Backspace' || key === 'Enter') {
        return;
      }

      if (key.length === 1) {
        event.preventDefault();

        const replaced = singleMap[key] || allCombos[key];

        if (replaced) {
          const pos = textArea.selectionStart;
          const before = textArea.value;
          textArea.value = before.slice(0, pos) + replaced + before.slice(pos);
          textArea.selectionStart = textArea.selectionEnd = pos + 1;
          return;
        }

        latinBuffer += key;
        const combo = findComboAtEnd(latinBuffer);
        if (combo) {
          const out = allCombos[combo];
          const pos = textArea.selectionStart;
          const before = textArea.value;
          textArea.value = before.slice(0, pos - 1) + out + before.slice(pos);
          textArea.selectionStart = textArea.selectionEnd = pos;
          latinBuffer = '';
          return;
        }

        const pos = textArea.selectionStart;
        const before = textArea.value;
        textArea.value = before.slice(0, pos) + key + before.slice(pos);
        textArea.selectionStart = textArea.selectionEnd = pos + 1;
      }
    });

    function buildKeyboard() {
      const rows = [
        ['q', 'w', 'e', 'r', 't', 'y', 'u', 'i', 'o', 'p'],
        ['a', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l'],
        ['z', 'x', 'c', 'v', 'b', 'n', 'm'],
        ['space'],
        ['backspace', 'enter']
      ];

      const rowContainers = [
        document.getElementById('kbdRow1'),
        document.getElementById('kbdRow2'),
        document.getElementById('kbdRow3'),
        document.getElementById('kbdRow4'),
        document.getElementById('kbdRow5')
      ];

      rows.forEach((row, rowIndex) => {
        const rowEl = rowContainers[rowIndex];
        rowEl.innerHTML = '';

        row.forEach((key) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'key';

          if (key === 'space') {
            btn.className += ' space';
            btn.textContent = 'Space';
            btn.addEventListener('click', () => {
              if (!translitEnabled) return;
              const pos = textArea.selectionStart;
              const before = textArea.value;
              textArea.value = before.slice(0, pos) + ' ' + before.slice(pos);
              textArea.selectionStart = textArea.selectionEnd = pos + 1;
              textArea.focus();
            });
            rowEl.appendChild(btn);
            return;
          }

          if (key === 'backspace') {
            btn.className += ' backspace';
            btn.textContent = '⌫';
            btn.addEventListener('click', () => {
              if (!translitEnabled) return;
              const pos = textArea.selectionStart;
              textArea.value = textArea.value.slice(0, pos - 1) + textArea.value.slice(pos);
              textArea.selectionStart = textArea.selectionEnd = pos - 1;
              textArea.focus();
            });
            rowEl.appendChild(btn);
            return;
          }

          if (key === 'enter') {
            btn.className += ' enter';
            btn.textContent = '↵';
            btn.addEventListener('click', () => {
              if (!translitEnabled) return;
              const pos = textArea.selectionStart;
              const before = textArea.value;
              textArea.value = before.slice(0, pos) + '\n' + before.slice(pos);
              textArea.selectionStart = textArea.selectionEnd = pos + 1;
              textArea.focus();
            });
            rowEl.appendChild(btn);
            return;
          }

          const mapped = singleMap[key] || key.toUpperCase();
          btn.textContent = mapped;
          btn.addEventListener('click', () => {
            if (!translitEnabled) return;
            const pos = textArea.selectionStart;
            const before = textArea.value;
            textArea.value = before.slice(0, pos) + mapped + before.slice(pos);
            textArea.selectionStart = textArea.selectionEnd = pos + 1;
            textArea.focus();
          });
          rowEl.appendChild(btn);
        });
      });
    }

    buildKeyboard();
    applyThemeFromSystem();
    setTranslitState(true);
  </script>
</body>
</html>
