<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Транслит — печатайте латиницей, получайте кириллицу</title>
<meta name="description" content="Онлайн-транслитератор: печатайте латиницей — текст сразу становится кириллицей. Esc переключает режим ввода. Схема как на translit.net.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%232f9e5f' width='100' height='100' rx='20'/><text x='50' y='66' font-size='58' font-weight='bold' text-anchor='middle' fill='white' font-family='Arial'>Я</text></svg>">
<style>
  :root {
    --bg: #f2f4f3;
    --panel: #ffffff;
    --text: #1b1f1d;
    --muted: #6b7772;
    --border: #d8dedb;
    --accent: #2f9e5f;
    --accent-hover: #26804e;
    --accent-soft: #e6f5ec;
    --shadow: 0 6px 24px rgba(0, 0, 0, .07);
    --radius: 12px;
  }

  body.dark {
    --bg: #131619;
    --panel: #1d2226;
    --text: #e8ecea;
    --muted: #93a09a;
    --border: #313840;
    --accent: #3fb573;
    --accent-hover: #52cd86;
    --accent-soft: #1a2b23;
    --shadow: 0 6px 24px rgba(0, 0, 0, .35);
  }

  body.latin-mode {
    --accent: #d9930f;
    --accent-hover: #b87b0b;
    --accent-soft: #fdf3dd;
  }

  body.dark.latin-mode {
    --accent: #e0a534;
    --accent-hover: #f0b64a;
    --accent-soft: #33280f;
  }

  * { box-sizing: border-box; }

  html, body { min-height: 100%; }

  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    transition: background .2s ease, color .2s ease;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: .2px;
  }

  .brand .badge {
    display: grid;
    place-items: center;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 16px;
    transition: background .2s ease;
  }

  main {
    display: flex;
    flex-direction: column;
    width: min(1120px, 100%);
    margin: 0 auto;
    padding: 18px 20px 22px;
    flex: 1 0 auto;
    gap: 12px;
  }

  .mode {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 14px;
    color: var(--muted);
  }

  .mode strong {
    color: var(--text);
    font-weight: 700;
  }

  .mode .sep { color: var(--muted); }

  .linkbtn {
    border: 0;
    background: transparent;
    padding: 2px 4px;
    font: inherit;
    font-size: 14px;
    color: var(--accent);
    cursor: pointer;
  }

  .linkbtn > span {
    border-bottom: 1px dashed currentColor;
  }

  .linkbtn:hover { color: var(--accent-hover); }

  .linkbtn:hover > span { border-bottom-style: solid; }

  kbd {
    display: inline-block;
    padding: 1px 6px;
    margin-left: 4px;
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 5px;
    background: var(--panel);
    color: var(--muted);
    font: inherit;
    font-size: 11px;
    font-weight: 700;
    vertical-align: 1px;
  }

  .editor {
    display: flex;
    flex-direction: column;
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: background .2s ease, border-color .2s ease;
  }

  .editor textarea {
    flex: 1;
    width: 100%;
    min-height: 52vh;
    padding: 18px;
    border: 0;
    outline: none;
    resize: vertical;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 18px;
    line-height: 1.6;
  }

  .editor textarea::placeholder { color: var(--muted); opacity: .75; }

  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
  }

  button.btn {
    border: 1px solid transparent;
    border-radius: 10px;
    padding: 11px 20px;
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease, color .15s ease;
  }

  button.btn.primary {
    background: var(--accent);
    color: #fff;
  }

  button.btn.primary:hover { background: var(--accent-hover); }

  button.btn.primary.done { background: var(--accent-hover); }

  button.btn.secondary {
    background: transparent;
    border-color: var(--border);
    color: var(--text);
  }

  button.btn.secondary:hover {
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .count {
    margin-left: auto;
    font-size: 13px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .ref {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 0 16px;
    transition: background .2s ease, border-color .2s ease;
  }

  .ref[open] { padding-bottom: 16px; }

  .ref summary {
    cursor: pointer;
    padding: 12px 0;
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    list-style: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .ref summary::-webkit-details-marker { display: none; }

  .ref summary::after {
    content: "▾";
    margin-left: auto;
    color: var(--muted);
    transition: transform .2s ease;
  }

  .ref:not([open]) summary::after { transform: rotate(-90deg); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
    gap: 6px;
    margin-top: 2px;
  }

  .cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-height: 62px;
    padding: 6px 4px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    transition: background .12s ease, border-color .12s ease;
  }

  .cell:hover {
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .cell .cyr {
    font-size: 20px;
    font-weight: 700;
    line-height: 1;
  }

  .cell .lat {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    word-break: break-word;
    line-height: 1.25;
  }

  @media (max-width: 760px) {
    main { padding: 12px; gap: 10px; }
    .editor textarea { min-height: 42vh; padding: 14px; font-size: 17px; }
    .mode { font-size: 13px; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="badge">Я</span> Транслит</div>
  </div>

  <main>
    <div class="mode">
      <span id="modeText">Я хочу писать по-русски</span>
      <span class="sep">·</span>
      <button class="linkbtn" id="modeBtn" type="button"><span id="modeBtnLabel">Включить латиницу</span><kbd>Esc</kbd></button>
    </div>

    <div class="editor">
      <textarea id="src" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="Начните печатать латиницей…"></textarea>
    </div>

    <div class="controls">
      <button class="btn primary" id="copyBtn" type="button">Копировать</button>
      <button class="btn secondary" id="clearBtn" type="button">Очистить</button>
      <span class="count" id="count">0</span>
    </div>

    <details class="ref">
      <summary>Таблица транслитерации</summary>
      <div class="grid" id="grid"></div>
    </details>
  </main>

  <script>
    const LAT2CYR = {
      a: 'а', b: 'б', v: 'в', g: 'г', d: 'д', e: 'е', z: 'з', i: 'и', j: 'й',
      k: 'к', l: 'л', m: 'м', n: 'н', o: 'о', p: 'п', r: 'р', s: 'с', t: 'т',
      u: 'у', f: 'ф', h: 'х', x: 'х', c: 'ц', y: 'ы', w: 'щ',
      zh: 'ж', ch: 'ч', sh: 'ш', shh: 'щ',
      jo: 'ё', yo: 'ё', 'ö': 'ё',
      je: 'э', 'ä': 'э',
      ju: 'ю', yu: 'ю', 'ü': 'ю',
      ja: 'я', ya: 'я', q: 'я',
      "'": 'ь', mz: 'ь',
      '#': 'ъ', '##': 'ъ', tvz: 'ъ'
    };

    const TABLE = [
      { cyr: 'А', lat: 'a' }, { cyr: 'Б', lat: 'b' }, { cyr: 'В', lat: 'v' },
      { cyr: 'Г', lat: 'g' }, { cyr: 'Д', lat: 'd' }, { cyr: 'Е', lat: 'e' },
      { cyr: 'Ё', lat: 'jo, yo, ö' }, { cyr: 'Ж', lat: 'zh' }, { cyr: 'З', lat: 'z' },
      { cyr: 'И', lat: 'i' }, { cyr: 'Й', lat: 'j' }, { cyr: 'К', lat: 'k' },
      { cyr: 'Л', lat: 'l' }, { cyr: 'М', lat: 'm' }, { cyr: 'Н', lat: 'n' },
      { cyr: 'О', lat: 'o' }, { cyr: 'П', lat: 'p' }, { cyr: 'Р', lat: 'r' },
      { cyr: 'С', lat: 's' }, { cyr: 'Т', lat: 't' }, { cyr: 'У', lat: 'u' },
      { cyr: 'Ф', lat: 'f' }, { cyr: 'Х', lat: 'h, x' }, { cyr: 'Ц', lat: 'c' },
      { cyr: 'Ч', lat: 'ch' }, { cyr: 'Ш', lat: 'sh' }, { cyr: 'Щ', lat: 'shh, w' },
      { cyr: 'Ъ', lat: '##, #, tvz' }, { cyr: 'Ы', lat: 'y' }, { cyr: 'Ь', lat: "' , mz" },
      { cyr: 'Э', lat: 'je, ä' }, { cyr: 'Ю', lat: 'ju, yu, ü' }, { cyr: 'Я', lat: 'ja, ya, q' }
    ];

    const LAT_KEYS = Object.keys(LAT2CYR).sort((a, b) => b.length - a.length);
    const LIVE_KEYS = LAT_KEYS.filter(k => k !== 'tvz' && k !== 'mz' && k !== '##');
    const PREFIXES = new Set();
    for (const k of LIVE_KEYS) {
      for (let i = 1; i < k.length; i++) PREFIXES.add(k.slice(0, i));
    }

    const srcEl = document.getElementById('src');
    const countEl = document.getElementById('count');
    const copyBtn = document.getElementById('copyBtn');
    const clearBtn = document.getElementById('clearBtn');
    const modeBtn = document.getElementById('modeBtn');
    const modeBtnLabel = document.getElementById('modeBtnLabel');
    const modeText = document.getElementById('modeText');
    const gridEl = document.getElementById('grid');

    let translitOn = true;
    let pending = '';

    function isAllCaps(sample) {
      return sample === sample.toUpperCase() && sample !== sample.toLowerCase();
    }

    function applyCase(result, sample) {
      const first = sample.charAt(0);
      const firstUpper = first === first.toUpperCase() && first !== first.toLowerCase();
      if (sample.length > 1 && isAllCaps(sample)) return result.toUpperCase();
      if (firstUpper) return result.charAt(0).toUpperCase() + result.slice(1);
      return result;
    }

    function toCyrillic(text) {
      let out = '';
      let i = 0;
      while (i < text.length) {
        let hit = null;
        for (const key of LAT_KEYS) {
          if (i + key.length <= text.length &&
              text.substr(i, key.length).toLowerCase() === key) {
            hit = key;
            break;
          }
        }
        if (hit) {
          out += applyCase(LAT2CYR[hit], text.substr(i, hit.length));
          i += hit.length;
        } else {
          out += text.charAt(i);
          i += 1;
        }
      }
      return out;
    }

    function resolveLive(buffer) {
      let committed = '';
      let i = 0;
      while (i < buffer.length) {
        let hit = null;
        for (const key of LIVE_KEYS) {
          if (i + key.length <= buffer.length &&
              buffer.substr(i, key.length).toLowerCase() === key) {
            hit = key;
            break;
          }
        }
        if (!hit) {
          committed += buffer.charAt(i);
          i += 1;
          continue;
        }
        const atEnd = i + hit.length === buffer.length;
        const sample = buffer.substr(i, hit.length);
        if (atEnd && PREFIXES.has(hit)) {
          return { committed: committed, pending: sample };
        }
        committed += applyCase(LAT2CYR[hit], sample);
        i += hit.length;
      }
      return { committed: committed, pending: '' };
    }

    function updateCount() {
      countEl.textContent = Array.from(srcEl.value).length;
    }

    function replaceSelection(text) {
      const start = srcEl.selectionStart;
      const end = srcEl.selectionEnd;
      srcEl.value = srcEl.value.slice(0, start) + text + srcEl.value.slice(end);
      const caret = start + text.length;
      srcEl.setSelectionRange(caret, caret);
      updateCount();
    }

    function commitPending() {
      if (!pending) return;
      const pos = srcEl.selectionStart;
      const start = pos - pending.length;
      if (start >= 0 && srcEl.value.slice(start, pos) === pending) {
        const fixed = toCyrillic(pending);
        srcEl.value = srcEl.value.slice(0, start) + fixed + srcEl.value.slice(pos);
        const caret = start + fixed.length;
        srcEl.setSelectionRange(caret, caret);
        updateCount();
      }
      pending = '';
    }

    function handleInput(e) {
      if (!translitOn) {
        pending = '';
        updateCount();
        return;
      }

      if (e.inputType === 'insertText' && e.data && e.data.length === 1) {
        const pos = srcEl.selectionStart;
        const at = pos - 1;
        const prev = srcEl.value.slice(Math.max(0, at - pending.length), at);
        if (pending && prev !== pending) pending = '';

        const buffer = pending + e.data;
        const resolved = resolveLive(buffer);
        const inserted = resolved.committed + resolved.pending;

        pending = resolved.pending;

        if (inserted !== buffer) {
          const start = at - (buffer.length - e.data.length);
          srcEl.value = srcEl.value.slice(0, start) + inserted + srcEl.value.slice(pos);
          const caret = start + inserted.length;
          srcEl.setSelectionRange(caret, caret);
        }

        updateCount();
        return;
      }

      commitPending();
      updateCount();
    }

    function setMode(on) {
      commitPending();
      translitOn = on;
      if (on) {
        const before = srcEl.value;
        const after = toCyrillic(before);
        if (after !== before) {
          srcEl.value = after;
          srcEl.setSelectionRange(after.length, after.length);
        }
      }
      document.body.classList.toggle('latin-mode', !on);
      modeText.textContent = on ? 'Я хочу писать по-русски' : 'Я хочу писать латиницей';
      modeBtnLabel.textContent = on ? 'Включить латиницу' : 'Включить кириллицу';
      srcEl.placeholder = on ? 'Начните печатать латиницей…' : 'Обычный ввод — без транслита…';
      updateCount();
      srcEl.focus();
    }

    function clearAll() {
      srcEl.value = '';
      pending = '';
      updateCount();
      srcEl.focus();
    }

    function copyAll() {
      const text = srcEl.value;
      const done = () => {
        copyBtn.textContent = 'Скопировано ✓';
        copyBtn.classList.add('done');
        setTimeout(() => {
          copyBtn.textContent = 'Копировать';
          copyBtn.classList.remove('done');
        }, 1500);
      };

      const fallback = () => {
        srcEl.select();
        try { document.execCommand('copy'); } catch (err) {}
        const caret = srcEl.value.length;
        srcEl.setSelectionRange(caret, caret);
        srcEl.focus();
        done();
      };

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(done, fallback);
      } else {
        fallback();
      }
    }

    function insertChar(text) {
      commitPending();
      replaceSelection(text);
      srcEl.focus();
    }

    function buildTable() {
      const frag = document.createDocumentFragment();
      for (const entry of TABLE) {
        const primary = entry.lat.split(',')[0].trim();

        const cell = document.createElement('button');
        cell.type = 'button';
        cell.className = 'cell';
        cell.title = 'Вставить «' + entry.cyr + '»';

        const upper = document.createElement('span');
        upper.className = 'cyr';
        upper.textContent = entry.cyr;

        const lower = document.createElement('div');
        lower.className = 'lat';
        lower.textContent = entry.lat;

        cell.append(upper, lower);
        cell.addEventListener('click', () => {
          insertChar(translitOn ? entry.cyr.toLowerCase() : primary);
        });
        frag.appendChild(cell);
      }
      gridEl.appendChild(frag);
    }

    const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');

    function syncTheme() {
      document.body.classList.toggle('dark', darkQuery.matches);
    }

    srcEl.addEventListener('input', handleInput);

    srcEl.addEventListener('paste', (e) => {
      if (!translitOn) return;
      const text = e.clipboardData && e.clipboardData.getData('text');
      if (!text) return;
      e.preventDefault();
      commitPending();
      replaceSelection(toCyrillic(text));
    });

    srcEl.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.altKey || e.metaKey) return;
      if (['Enter', 'Tab', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End', 'PageUp', 'PageDown'].includes(e.key)) {
        commitPending();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      e.preventDefault();
      setMode(!translitOn);
    });

    srcEl.addEventListener('blur', commitPending);

    modeBtn.addEventListener('click', () => setMode(!translitOn));
    clearBtn.addEventListener('click', clearAll);
    copyBtn.addEventListener('click', copyAll);

    darkQuery.addEventListener('change', syncTheme);

    buildTable();
    syncTheme();
    updateCount();
  </script>
</body>
</html>
