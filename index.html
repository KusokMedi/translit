<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Транслит — печатайте латиницей, получайте кириллицу</title>
<meta name="description" content="Онлайн-транслитератор: печатайте латиницей — текст сразу становится кириллицей. Esc переключает режим ввода. Схема как на translit.net.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%232f9e5f' width='100' height='100' rx='20'/><text x='50' y='66' font-size='58' font-weight='bold' text-anchor='middle' fill='white' font-family='Arial'>Я</text></svg>">
<style>
  :root {
    --bg: #f2f4f3;
    --panel: #ffffff;
    --text: #1b1f1d;
    --muted: #6b7772;
    --border: #d8dedb;
    --accent: #2f9e5f;
    --accent-hover: #26804e;
    --accent-soft: #e6f5ec;
    --shadow: 0 6px 24px rgba(0, 0, 0, .07);
    --radius: 12px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131619;
      --panel: #1d2226;
      --text: #e8ecea;
      --muted: #93a09a;
      --border: #313840;
      --accent: #3fb573;
      --accent-hover: #52cd86;
      --accent-soft: #1a2b23;
      --shadow: 0 6px 24px rgba(0, 0, 0, .35);
    }
  }

  body.latin-mode {
    --accent: #d9930f;
    --accent-hover: #b87b0b;
    --accent-soft: #fdf3dd;
  }

  @media (prefers-color-scheme: dark) {
    body.latin-mode {
      --accent: #e0a534;
      --accent-hover: #f0b64a;
      --accent-soft: #33280f;
    }
  }

  * { box-sizing: border-box; }

  html, body { min-height: 100%; }

  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    transition: background .2s ease, color .2s ease;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: .2px;
  }

  .brand .badge {
    display: grid;
    place-items: center;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 16px;
    transition: background .2s ease;
  }

  main {
    display: flex;
    flex-direction: column;
    width: min(1120px, 100%);
    margin: 0 auto;
    padding: 18px 20px 22px;
    flex: 1 0 auto;
    gap: 12px;
  }

  .mode {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 14px;
    color: var(--muted);
  }

  .mode strong {
    color: var(--text);
    font-weight: 700;
  }

  .mode .sep { color: var(--muted); }

  .linkbtn {
    border: 0;
    background: transparent;
    padding: 2px 4px;
    font: inherit;
    font-size: 14px;
    color: var(--accent);
    cursor: pointer;
  }

  .linkbtn > span {
    border-bottom: 1px dashed currentColor;
  }

  .linkbtn:hover { color: var(--accent-hover); }

  .linkbtn:hover > span { border-bottom-style: solid; }

  kbd {
    display: inline-block;
    padding: 1px 6px;
    margin-left: 4px;
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 5px;
    background: var(--panel);
    color: var(--muted);
    font: inherit;
    font-size: 11px;
    font-weight: 700;
    vertical-align: 1px;
  }

  .editor {
    display: flex;
    flex-direction: column;
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: background .2s ease, border-color .2s ease;
  }

  .editor textarea {
    flex: 1;
    width: 100%;
    min-height: 52vh;
    padding: 18px;
    border: 0;
    outline: none;
    resize: vertical;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 18px;
    line-height: 1.6;
  }

  .editor textarea::placeholder { color: var(--muted); opacity: .75; }

  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
  }

  button.btn {
    border: 1px solid transparent;
    border-radius: 10px;
    padding: 11px 20px;
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease, color .15s ease;
  }

  button.btn.primary {
    background: var(--accent);
    color: #fff;
  }

  button.btn.primary:hover { background: var(--accent-hover); }

  button.btn.primary.done { background: var(--accent-hover); }

  button.btn.secondary {
    background: transparent;
    border-color: var(--border);
    color: var(--text);
  }

  button.btn.secondary:hover {
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .count {
    margin-left: auto;
    font-size: 13px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .ref {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 0 16px;
    transition: background .2s ease, border-color .2s ease;
  }

  .ref[open] { padding-bottom: 16px; }

  .ref summary {
    cursor: pointer;
    padding: 12px 0;
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    list-style: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .ref summary::-webkit-details-marker { display: none; }

  .ref summary::after {
    content: "▾";
    margin-left: auto;
    color: var(--muted);
    transition: transform .2s ease;
  }

  .ref:not([open]) summary::after { transform: rotate(-90deg); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
    gap: 5px;
    margin-top: 2px;
  }

  .cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    min-height: 68px;
    padding: 5px 3px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    transition: background .12s ease, border-color .12s ease;
  }

  .cell:hover {
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .cell .top {
    font-size: 12px;
    font-weight: 700;
    line-height: 1.15;
    color: var(--muted);
  }

  .cell .mid {
    font-size: 10px;
    color: var(--muted);
    line-height: 1.25;
    text-align: center;
    word-break: break-word;
  }

  .cell .bot {
    font-size: 17px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1.15;
  }

  .cell.shift .top { font-size: 11px; }

  .cell.shift.on {
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .cell.shift.on .bot { color: var(--accent); }

  @media (max-width: 760px) {
    main { padding: 12px; gap: 10px; }
    .editor textarea { min-height: 42vh; padding: 14px; font-size: 17px; }
    .mode { font-size: 13px; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="badge">Я</span> Транслит</div>
  </div>

  <main>
    <div class="mode">
      <span id="modeText">Я хочу писать по-русски</span>
      <span class="sep">·</span>
      <button class="linkbtn" id="modeBtn" type="button"><span id="modeBtnLabel">Включить латиницу</span><kbd>Esc</kbd></button>
    </div>

    <details class="ref" id="ref">
      <summary>Клавиатура транслита</summary>
      <div class="grid" id="grid"></div>
    </details>

    <div class="editor">
      <textarea id="src" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="Начните печатать латиницей…"></textarea>
    </div>

    <div class="controls">
      <button class="btn primary" id="copyBtn" type="button">Копировать</button>
      <button class="btn secondary" id="clearBtn" type="button">Очистить</button>
      <span class="count" id="count">0</span>
    </div>
  </main>

  <script>
    const LAT2CYR = {
      a: 'а', b: 'б', v: 'в', g: 'г', d: 'д', e: 'е', z: 'з', i: 'и', j: 'й',
      k: 'к', l: 'л', m: 'м', n: 'н', o: 'о', p: 'п', r: 'р', s: 'с', t: 'т',
      u: 'у', f: 'ф', h: 'х', x: 'х', c: 'ц', y: 'ы', w: 'щ',
      zh: 'ж', ch: 'ч', sh: 'ш', shh: 'щ',
      jo: 'ё', yo: 'ё', 'ö': 'ё', '`': 'ё',
      je: 'э', 'ä': 'э',
      ju: 'ю', yu: 'ю', 'ü': 'ю',
      ja: 'я', ya: 'я', q: 'я',
      "'": 'ь', mz: 'ь', mjz: 'ь',
      '#': 'ъ', '##': 'ъ', tvz: 'ъ'
    };

    const TABLE = [
      { cyr: 'А', shift: 'A', lat: 'a' },
      { cyr: 'Б', shift: 'B', lat: 'b' },
      { cyr: 'В', shift: 'V', lat: 'v' },
      { cyr: 'Г', shift: 'G', lat: 'g' },
      { cyr: 'Д', shift: 'D', lat: 'd' },
      { cyr: 'Е', shift: 'E', lat: 'e' },
      { cyr: 'Ё', shift: 'Jo', lat: 'jo,yo,ö,`' },
      { cyr: 'Ж', shift: 'Zh', lat: 'zh' },
      { cyr: 'З', shift: 'Z', lat: 'z' },
      { cyr: 'И', shift: 'I', lat: 'i' },
      { cyr: 'Й', shift: 'J', lat: 'j' },
      { cyr: 'К', shift: 'K', lat: 'k' },
      { cyr: 'Л', shift: 'L', lat: 'l' },
      { cyr: 'М', shift: 'M', lat: 'm' },
      { cyr: 'Н', shift: 'N', lat: 'n' },
      { cyr: 'О', shift: 'O', lat: 'o' },
      { cyr: 'П', shift: 'P', lat: 'p' },
      { cyr: 'Р', shift: 'R', lat: 'r' },
      { cyr: 'С', shift: 'S', lat: 's' },
      { cyr: 'Т', shift: 'T', lat: 't' },
      { cyr: 'У', shift: 'U', lat: 'u' },
      { cyr: 'Ф', shift: 'F', lat: 'f' },
      { cyr: 'Х', shift: 'H', lat: 'h,x' },
      { cyr: 'Ц', shift: 'C', lat: 'c' },
      { cyr: 'Ч', shift: 'Ch', lat: 'ch' },
      { cyr: 'Ш', shift: 'Sh', lat: 'sh' },
      { cyr: 'Щ', shift: 'Shh', lat: 'shh,w' },
      { cyr: 'Ъ', shift: '##', lat: '#,tvz' },
      { cyr: 'Ы', shift: 'Y', lat: 'y' },
      { cyr: 'Ь', shift: "'", lat: "',mjz" },
      { cyr: 'Э', shift: 'Je', lat: 'je,ä' },
      { cyr: 'Ю', shift: 'Ju', lat: 'ju,yu,ü' },
      { cyr: 'Я', shift: 'Ja', lat: 'ja,ya,q' }
    ];

    const LAT_KEYS = Object.keys(LAT2CYR).sort((a, b) => b.length - a.length);
    const PREFIXES = new Set();
    for (const k of LAT_KEYS) {
      for (let i = 1; i < k.length; i++) PREFIXES.add(k.slice(0, i));
    }

    const srcEl = document.getElementById('src');
    const countEl = document.getElementById('count');
    const copyBtn = document.getElementById('copyBtn');
    const clearBtn = document.getElementById('clearBtn');
    const modeBtn = document.getElementById('modeBtn');
    const modeBtnLabel = document.getElementById('modeBtnLabel');
    const modeText = document.getElementById('modeText');
    const gridEl = document.getElementById('grid');

    let translitOn = true;
    let shiftOn = false;
    let lastPlus = false;
    let tailSource = '';
    let tailRendered = '';
    let tailStart = 0;

    function isAllCaps(sample) {
      return sample === sample.toUpperCase() && sample !== sample.toLowerCase();
    }

    function applyCase(result, sample) {
      const first = sample.charAt(0);
      const firstUpper = first === first.toUpperCase() && first !== first.toLowerCase();
      if (sample.length > 1 && isAllCaps(sample)) return result.toUpperCase();
      if (firstUpper) return result.charAt(0).toUpperCase() + result.slice(1);
      return result;
    }

    function toCyrillic(text) {
      let out = '';
      let i = 0;
      while (i < text.length) {
        let hit = null;
        for (const key of LAT_KEYS) {
          if (i + key.length <= text.length &&
              text.substr(i, key.length).toLowerCase() === key) {
            hit = key;
            break;
          }
        }
        if (hit) {
          out += applyCase(LAT2CYR[hit], text.substr(i, hit.length));
          i += hit.length;
        } else {
          out += text.charAt(i);
          i += 1;
        }
      }
      return out;
    }

    function resolveLive(buffer) {
      let committed = '';
      let i = 0;
      while (i < buffer.length) {
        const rest = buffer.slice(i);
        if (PREFIXES.has(rest.toLowerCase())) {
          return { committed: committed, pending: rest };
        }
        let hit = null;
        for (const key of LAT_KEYS) {
          if (i + key.length <= buffer.length &&
              buffer.substr(i, key.length).toLowerCase() === key) {
            hit = key;
            break;
          }
        }
        if (hit) {
          committed += applyCase(LAT2CYR[hit], buffer.substr(i, hit.length));
          i += hit.length;
        } else {
          committed += buffer.charAt(i);
          i += 1;
        }
      }
      return { committed: committed, pending: '' };
    }

    function updateCount() {
      countEl.textContent = Array.from(srcEl.value).length;
    }

    function replaceSelection(text) {
      const start = srcEl.selectionStart;
      const end = srcEl.selectionEnd;
      srcEl.value = srcEl.value.slice(0, start) + text + srcEl.value.slice(end);
      const caret = start + text.length;
      srcEl.setSelectionRange(caret, caret);
      updateCount();
    }

    function resetTail() {
      tailSource = '';
      tailRendered = '';
    }

    function handleInput(e) {
      if (!translitOn) {
        resetTail();
        lastPlus = false;
        updateCount();
        return;
      }

      if (e.inputType === 'insertText' && e.data === '+') {
        if (lastPlus) {
          lastPlus = false;
          updateCount();
          return;
        }
        const pos = srcEl.selectionStart;
        srcEl.value = srcEl.value.slice(0, pos - 1) + srcEl.value.slice(pos);
        srcEl.setSelectionRange(pos - 1, pos - 1);
        resetTail();
        lastPlus = true;
        updateCount();
        return;
      }

      lastPlus = false;

      if (e.inputType === 'insertText' && e.data && e.data.length === 1) {
        const pos = srcEl.selectionStart;
        const at = pos - 1;

        const tailOk = tailSource &&
          tailStart + tailRendered.length === at &&
          srcEl.value.slice(tailStart, at) === tailRendered;

        if (!tailOk) {
          resetTail();
          tailStart = at;
        }

        const resolved = resolveLive(tailSource + e.data);
        const partial = toCyrillic(resolved.pending);
        const rendered = resolved.committed + partial;

        srcEl.value = srcEl.value.slice(0, tailStart) + rendered + srcEl.value.slice(pos);
        const caret = tailStart + rendered.length;
        srcEl.setSelectionRange(caret, caret);

        tailStart = tailStart + resolved.committed.length;
        tailRendered = partial;
        tailSource = resolved.pending;

        updateCount();
        return;
      }

      resetTail();
      updateCount();
    }

    function setMode(on) {
      resetTail();
      lastPlus = false;
      translitOn = on;
      if (on) {
        const before = srcEl.value;
        const after = toCyrillic(before);
        if (after !== before) {
          srcEl.value = after;
          srcEl.setSelectionRange(after.length, after.length);
        }
      }
      document.body.classList.toggle('latin-mode', !on);
      modeText.textContent = on ? 'Я хочу писать по-русски' : 'Я хочу писать латиницей';
      modeBtnLabel.textContent = on ? 'Включить латиницу' : 'Включить кириллицу';
      srcEl.placeholder = on ? 'Начните печатать латиницей…' : 'Обычный ввод — без транслита…';
      updateCount();
      srcEl.focus();
    }

    function clearAll() {
      srcEl.value = '';
      resetTail();
      lastPlus = false;
      updateCount();
      srcEl.focus();
    }

    function copyAll() {
      const text = srcEl.value;
      const done = () => {
        copyBtn.textContent = 'Скопировано ✓';
        copyBtn.classList.add('done');
        setTimeout(() => {
          copyBtn.textContent = 'Копировать';
          copyBtn.classList.remove('done');
        }, 1500);
      };

      const fallback = () => {
        srcEl.select();
        try { document.execCommand('copy'); } catch (err) {}
        const caret = srcEl.value.length;
        srcEl.setSelectionRange(caret, caret);
        srcEl.focus();
        done();
      };

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(done, fallback);
      } else {
        fallback();
      }
    }

    function insertChar(text) {
      resetTail();
      replaceSelection(text);
      srcEl.focus();
    }

    function buildTable() {
      const frag = document.createDocumentFragment();

      const shiftCell = document.createElement('button');
      shiftCell.type = 'button';
      shiftCell.className = 'cell shift' + (shiftOn ? ' on' : '');
      shiftCell.title = 'Заглавные буквы';

      const shiftTop = document.createElement('span');
      shiftTop.className = 'top';
      shiftTop.textContent = 'shift';
      const shiftBot = document.createElement('span');
      shiftBot.className = 'bot';
      shiftBot.textContent = '⇧';
      shiftCell.append(shiftTop, shiftBot);

      shiftCell.addEventListener('click', () => {
        shiftOn = !shiftOn;
        shiftCell.classList.toggle('on', shiftOn);
        srcEl.focus();
      });
      frag.appendChild(shiftCell);

      for (const entry of TABLE) {
        const primary = entry.lat.split(',')[0].trim();

        const cell = document.createElement('button');
        cell.type = 'button';
        cell.className = 'cell';
        cell.title = 'Вставить «' + entry.cyr + '»';

        const top = document.createElement('span');
        top.className = 'top';
        top.textContent = entry.shift;

        const mid = document.createElement('span');
        mid.className = 'mid';
        mid.textContent = entry.lat;

        const bot = document.createElement('span');
        bot.className = 'bot';
        bot.textContent = entry.cyr;

        cell.append(top, mid, bot);
        cell.addEventListener('click', () => {
          if (translitOn) {
            insertChar(shiftOn ? entry.cyr : entry.cyr.toLowerCase());
          } else {
            insertChar(shiftOn ? primary.toUpperCase() : primary);
          }
        });
        frag.appendChild(cell);
      }

      gridEl.appendChild(frag);
    }

    srcEl.addEventListener('input', handleInput);

    srcEl.addEventListener('paste', (e) => {
      if (!translitOn) return;
      const text = e.clipboardData && e.clipboardData.getData('text');
      if (!text) return;
      e.preventDefault();
      resetTail();
      replaceSelection(toCyrillic(text));
    });

    srcEl.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.altKey || e.metaKey) return;
      if (['Enter', 'Tab', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End', 'PageUp', 'PageDown'].includes(e.key)) {
        resetTail();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      e.preventDefault();
      setMode(!translitOn);
    });

    modeBtn.addEventListener('click', () => setMode(!translitOn));
    clearBtn.addEventListener('click', clearAll);
    copyBtn.addEventListener('click', copyAll);

    buildTable();
    if (window.innerWidth >= 900) document.getElementById('ref').open = true;
    updateCount();
  </script>
</body>
</html>
